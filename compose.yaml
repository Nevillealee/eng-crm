# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  server:
    build:
      context: .
      secrets:
        - app_env
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      NODE_ENV: production
      POSTGRES_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DATABASE}
      POSTGRES_PRISMA_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DATABASE}
      ADMIN_MAIL: ${ADMIN_MAIL}
      ADMIN_PW: ${ADMIN_PW}
    ports:
      - 3000:3000
    develop:
      watch:
        - action: sync
          path: ./app
          target: /src/app
          initial_sync: true
          ignore:
            - /src/node_modules/
        - action: rebuild
          path: package.json

  postgres:
    container_name: eng_crm_db
    image: postgres:latest
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE} #optional (specify default database instead of $POSTGRES_DB)
    ports:
      - "5433:5432"
    restart: always
    volumes:
      - db-data:/var/lib/postgresql

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=${ADMIN_MAIL}
      - PGADMIN_DEFAULT_PASSWORD=${ADMIN_PW}
    ports:
      - "5050:80"
    restart: always
volumes:
  db-data:

secrets:
  app_env:
    file: ./.env

# The commented out section below is an example of how to define a PostgreSQL
